name: android

# The wallet's and the explorer's Android apps, each built with its build-android.sh (which both
# hand to ui/build-android.sh): an APK for arm64 phones and one for x86-64 emulators. They are
# signed with the release key in the ANDROID_SIGNING_PEM secret when there is one (a certificate
# and its PKCS#8 RSA key, see docs/wallet.md), and with xbuild's debug key otherwise. Every run
# keeps them as artifacts; a v* tag attaches all four to its release. The runner's JDK and Android
# build-tools (ANDROID_HOME) compile in the file picker, ui/android/Picker.java.
on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: ${{ matrix.app }} apk (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wallet, explorer]
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }} -> target
          key: android-${{ matrix.app }}-${{ matrix.arch }}
      # xbuild compiles and links with the host's clang and lld, against an Android sysroot it
      # downloads itself: no NDK.
      - name: LLVM
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: build
        env:
          ANDROID_SIGNING_PEM: ${{ secrets.ANDROID_SIGNING_PEM }}
        run: |
          if [ -n "$ANDROID_SIGNING_PEM" ]; then
              export X_PEM="$ANDROID_SIGNING_PEM"
          else
              echo "::notice::no ANDROID_SIGNING_PEM secret: signing with xbuild's debug key"
          fi
          ${{ matrix.app }}/build-android.sh --arch ${{ matrix.arch }}
      # The script leaves the picker out when it finds no JDK or build-tools; here they are there.
      - name: picker
        run: |
          if ! unzip -l "${{ matrix.app }}/target/android/chainv4-${{ matrix.app }}-${{ matrix.arch }}.apk" | grep -q classes.dex; then
              echo "::error::the APK was built without the file picker"
              exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: chainv4-${{ matrix.app }}-android-${{ matrix.arch }}
          path: ${{ matrix.app }}/target/android/chainv4-${{ matrix.app }}-${{ matrix.arch }}.apk
          if-no-files-found: error

  # One job attaches them all, so two never race to make the release.
  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: chainv4-*-android-*
          merge-multiple: true
          path: apks
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" apks/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
              gh release create "$GITHUB_REF_NAME" apks/*.apk --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
