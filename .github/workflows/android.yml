name: android

# The wallet's and the explorer's Android apps, each built with its build-android.sh (which both
# hand to ui/build-android.sh): an APK for arm64 phones and one for x86-64 emulators. They are
# signed with the release key in the ANDROID_SIGNING_PEM secret when there is one (a certificate
# and its PKCS#8 RSA key, see docs/wallet.md), and with xbuild's debug key otherwise. Every run
# keeps them as artifacts; a v* tag attaches all four to its release. The file picker's Java goes in
# as the committed ui/android/classes.dex, added by ui/android/repack: neither the JDK nor the
# Android SDK is used to build them. The dex job checks that dex is what the Java builds.
on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: ${{ matrix.app }} apk (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wallet, explorer]
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # As rust-toolchain.toml pins it; tests/toolchains.rs checks they agree.
          toolchain: "1.98.1"
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }} -> target
          key: android-${{ matrix.app }}-${{ matrix.arch }}
      # xbuild compiles and links with the host's clang and lld, against an Android sysroot it
      # downloads itself: no NDK.
      - name: LLVM
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: build
        env:
          ANDROID_SIGNING_PEM: ${{ secrets.ANDROID_SIGNING_PEM }}
        run: |
          if [ -n "$ANDROID_SIGNING_PEM" ]; then
              export X_PEM="$ANDROID_SIGNING_PEM"
          else
              echo "::notice::no ANDROID_SIGNING_PEM secret: signing with xbuild's debug key"
          fi
          ${{ matrix.app }}/build-android.sh --arch ${{ matrix.arch }}
      # The script refuses a dex older than the Java; this checks the APK carries it.
      - name: picker
        run: |
          if ! unzip -l "${{ matrix.app }}/target/android/chainv4-${{ matrix.app }}-${{ matrix.arch }}.apk" | grep -q classes.dex; then
              echo "::error::the APK was built without the file picker"
              exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: chainv4-${{ matrix.app }}-android-${{ matrix.arch }}
          path: ${{ matrix.app }}/target/android/chainv4-${{ matrix.app }}-${{ matrix.arch }}.apk
          if-no-files-found: error

  # ui/android/classes.dex is what the Java beside it builds, by the JDK and d8 it names.
  dex:
    name: classes.dex is the Java's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tools
        run: |
          jdk=$(sed -n 's/^built with javac \([0-9]*\).*/\1/p' ui/android/classes.dex.sources)
          echo "JDK=$jdk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK }}
      - name: build-tools and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-33" > /dev/null
      - name: dex
        run: |
          ui/android/dex.sh
          if ! git diff --exit-code --stat ui/android/classes.dex ui/android/classes.dex.sources; then
              echo "::error::ui/android/classes.dex is not what its Java builds: run ui/android/dex.sh and commit it (the artifact holds this run's)"
              exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: classes-dex
          path: ui/android/classes.dex*

  # One job attaches them all, so two never race to make the release.
  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: chainv4-*-android-*
          merge-multiple: true
          path: apks
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" apks/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
              gh release create "$GITHUB_REF_NAME" apks/*.apk --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
