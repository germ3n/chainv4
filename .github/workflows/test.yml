name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The tests build the SDK's example contracts and run them on the chain.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            contracts -> target
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: clippy (contracts)
        run: cargo clippy --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      # The SDK's own tests run on the host; contracts only ever build for wasm32.
      - name: test (sdk)
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path contracts/Cargo.toml -p chainv4-sdk --locked --target "$host"

  # Every hash and key scheme sits behind a feature; these make sure each subset still builds,
  # lints clean and passes its tests.
  features:
    name: features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sha256,ed25519
          - blake3,edblake
          - keccak256,blake2s,blake2b,ed25519
          # Contracts and nodes need a secure hash; these run on ones other than BLAKE3.
          - lvm,sha256,ed25519
          - wasm,keccak256,ed25519
          - lvm,wasm,blake2s,edblake
          - node,blake2b,ed25519
          - http,sha256,edblake
          - client,keccak256,edblake
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: clippy
        run: cargo clippy --all-targets --locked --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: test
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}"
