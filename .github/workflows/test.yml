name: test

on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The tests build the SDK's example contracts and run them on the chain.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            contracts -> target
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: clippy (contracts)
        run: cargo clippy --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      # The SDK's own tests run on the host; contracts only ever build for wasm32.
      - name: test (sdk)
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path contracts/Cargo.toml -p chainv4-sdk --locked --target "$host"

  # What the wallet and the explorer share: a workspace of its own, for the desktop, the browser
  # and Android, whose clipboard it reaches through JNI. The apps' own Android code is built by
  # the android workflow: linting it here would need an Android sysroot for ring's C, which is
  # also why Android is linted here without the tls feature.
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui -> target
      # What winit and egui's clipboard build against on Linux.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: clippy
        run: cargo clippy --manifest-path ui/Cargo.toml --all-targets --features blocks --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path ui/Cargo.toml --features camera,blocks --locked
      - name: clippy (web)
        run: cargo clippy --manifest-path ui/Cargo.toml --target wasm32-unknown-unknown --features blocks --locked -- -D warnings
      - name: clippy (android)
        run: cargo clippy --manifest-path ui/Cargo.toml --target aarch64-linux-android --no-default-features --features camera --locked -- -D warnings

  # The explorer is a workspace of its own, for the desktop and the browser.
  explorer:
    name: explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: explorer -> target
      # What winit and egui's clipboard build against on Linux.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: clippy
        run: cargo clippy --manifest-path explorer/Cargo.toml --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path explorer/Cargo.toml --locked
      - name: clippy (web)
        run: cargo clippy --manifest-path explorer/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

  # The wallet too: a workspace of its own, for the desktop and the browser.
  wallet:
    name: wallet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet -> target
      # What winit and egui's clipboard build against on Linux.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: clippy
        run: cargo clippy --manifest-path wallet/Cargo.toml --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path wallet/Cargo.toml --locked
      - name: clippy (no swaps)
        run: cargo clippy --manifest-path wallet/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
      - name: clippy (web)
        run: cargo clippy --manifest-path wallet/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

  # Every hash and key scheme sits behind a feature; these make sure each subset still builds,
  # lints clean and passes its tests.
  features:
    name: features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sha256,ed25519
          - blake3,edblake
          - keccak256,blake2s,blake2b,ed25519
          # Ethereum's scheme on its own, and seed phrases with and without it.
          - sha256,secp256k1
          - blake3,ed25519,mnemonic
          - keccak256,edblake,secp256k1,mnemonic
          # Bitcoin's scheme with only Ethereum's beside it, and with seed phrases.
          - blake3,bitcoin
          - sha256,ed25519,bitcoin,mnemonic
          - blake3,swap
          - lvm,sha256,ed25519,swap
          # Contracts and nodes need a secure hash; these run on ones other than BLAKE3.
          - lvm,sha256,ed25519
          - wasm,keccak256,ed25519
          - lvm,wasm,blake2s,edblake
          - node,blake2b,ed25519
          - http,sha256,edblake
          - stream,blake2b,edblake
          - client,keccak256,edblake
          - node,blake3,secp256k1
          # Each kind of finality on its own; the rows above have none.
          - http,client,blake3,ed25519,finality-ffg
          - http,client,sha256,edblake,finality-authority
          - http,client,keccak256,ed25519,finality-depth
          # Governance, each kind on its own, on the finality it needs an electorate from; and a
          # node with no governance at all.
          - http,client,blake3,ed25519,finality-ffg,governance-electorate
          - http,client,sha256,edblake,finality-authority,governance-council
          # Mining on the GPU through wgpu: builds everywhere, and its tests skip without a GPU.
          - node,blake3,ed25519,gpu
          # Releases for the apps alone, and a node fetching them with HTTP but no pool.
          - release,blake3,ed25519
          - updates,http,sha256,edblake
          # Anchoring into each chain on its own, on a node whose finality has checkpoints.
          - http,blake3,ed25519,finality-ffg,anchoring-btc
          - http,sha256,ed25519,finality-ffg,anchoring-eth
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: clippy
        run: cargo clippy --all-targets --locked --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: test
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}"
