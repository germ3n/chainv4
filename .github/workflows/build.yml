name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # As rust-toolchain.toml pins it; tests/toolchains.rs checks they agree.
          toolchain: "1.98.1"
      # Luau's and RocksDB's C and C++ by the very clang the Docker image has, LLVM's release by its
      # SHA-256 (docker/llvm.sh; docs/development.md, "Toolchains"): the runner's own cc is GCC.
      - name: clang
        if: runner.os == 'Linux'
        run: |
          sudo sh docker/llvm.sh /opt/llvm
          echo "CC=/opt/llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/opt/llvm/bin/clang++" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/opt/llvm/lib" >> "$GITHUB_ENV"
          echo "/opt/llvm/bin" >> "$GITHUB_PATH"
      # macOS builds with the runner's Apple clang, which cannot be pinned as clang is: say which.
      - name: clang (macOS)
        if: runner.os == 'macOS'
        run: clang --version | head -n 1
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked
      # build.rs writes the wiki next to the binaries, so it ships with them.
      - uses: actions/upload-artifact@v7
        with:
          name: chainv4-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/chainv4
            target/wiki/index.html
          if-no-files-found: error

  contracts:
    name: example contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # As rust-toolchain.toml pins it; tests/toolchains.rs checks they agree.
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target
      - name: build
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: example-contracts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
