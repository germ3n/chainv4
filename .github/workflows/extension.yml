name: extension

# The wallet as a browser extension, for Chrome and for Firefox, built with
# wallet/build-extension.sh when started by hand: the zips are kept as artifacts, those named -store
# for the stores, which take no miner, the others for chrome://extensions and about:debugging. A run
# started on a v* tag attaches them to its release.

on:
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: wallet extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # As rust-toolchain.toml pins it; tests/toolchains.rs checks they agree.
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet -> target
          key: extension
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.0
      - name: test the extension's scripts
        run: node --test wallet/extension/test.mjs
      - name: build
        run: wallet/build-extension.sh
      - name: build for the stores
        run: wallet/build-extension.sh --store
      - uses: actions/upload-artifact@v7
        with:
          name: chainv4-wallet-extensions
          path: wallet/target/extension/chainv4-wallet-*.zip
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: chainv4-wallet-extensions
          path: zips
      # The Android workflow may be making the same release at the same moment: whichever comes
      # second uploads to the one the first made.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
              if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                  gh release upload "$GITHUB_REF_NAME" zips/*.zip --clobber --repo "$GITHUB_REPOSITORY" && exit 0
              elif gh release create "$GITHUB_REF_NAME" zips/*.zip --generate-notes --repo "$GITHUB_REPOSITORY"; then
                  exit 0
              fi
              sleep 10
          done
          exit 1
