# Contracts build for wasm32-unknown-unknown, so they live in a workspace of their own.
[workspace]
members = ["sdk", "sdk-macros", "examples/counter", "examples/members", "examples/proxy", "examples/vault", "examples/token", "examples/nft", "examples/multi", "examples/btc_relay", "examples/upgradable", "examples/points", "examples/integers", "examples/names", "examples/evm"]
resolver = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
