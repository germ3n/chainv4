[package]
name = "chainv4-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Write chainv4 contracts in Rust, for the WebAssembly engine."

[features]
default = ["allocator", "panic-handler"]
# A bump allocator: every call starts from a fresh instance, so nothing is ever freed.
allocator = []
# Panics abort the call with their message.
panic-handler = []

[dependencies]
chainv4-sdk-macros = { path = "../sdk-macros" }
