[package]
name = "explorer"
version = "0.1.0"
edition = "2024"
description = "A chainv4 explorer: blocks, transactions and their hops, the network and the mempool, live. Runs as a desktop app or in the browser."

[dependencies]
# Only the parts that build for the browser too: transactions, keys and hashes.
chainv4 = { path = "..", default-features = false, features = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "persistence"] }
egui = "0.37.0"
egui_plot = "0.38.0"
ehttp = { version = "0.7.2", features = ["streaming"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1.1.0"
wincode = "0.6.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
env_logger = "0.11.11"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
rfd = "0.17.2"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "Window"] }

# A workspace of its own: egui and the browser crates never meet the node's lockfile.
[workspace]
