[package]
# Named apart from its binary, `explorer`: the library's file and the binary's would otherwise
# collide in a wasm32 build. xbuild names the Android app's library after the package.
name = "chainv4-explorer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A chainv4 explorer: blocks, transactions and their hops, the network and the mempool, live. Runs as a desktop app, in the browser, on Android and on iOS."

# The app is a library, as Android loads it; the binary runs it on the desktop and in the browser.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "explorer"
path = "src/main.rs"

[dependencies]
# The wallet's codes, ur:chainv4-multisig/... and ur:chainv4-signed/..., which the Decode tool reads.
ur = "0.5.2"
# Only the parts that build for the browser too: transactions, keys and hashes; transfers through the
# bridges, to tell what signatures over one are for; and releases, which it checks against the
# release keys built in and, on the desktop, puts in place of itself.
chainv4 = { path = "..", default-features = false, features = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "bitcoin", "abi", "swap", "dex", "bridge", "release"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "persistence"] }
egui = "0.37.0"
zeroize = "1.9.1"
# The look's widgets, talking to the node through a proxy, and running on Android, shared with the
# wallet.
chainv4-ui = { path = "../ui", features = ["blocks", "bridge"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1.1.0"
wincode = "0.6.3"

# glow everywhere but iOS: eframe builds with a renderer only.
[target.'cfg(not(target_os = "ios"))'.dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow"]

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "wayland", "x11"] }
env_logger = "0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "Window"] }

# Android runs it in a NativeActivity: no Java of its own, and chainv4-ui does the rest.
# accesskit does not work with one.
# iOS draws through Metal, wgpu's, as Apple has deprecated OpenGL there; chainv4-ui does the rest.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }

# A workspace of its own: egui and the browser crates never meet the node's lockfile.
[workspace]
