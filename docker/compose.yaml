# A chainv4 node behind nginx, with HTTPS from a certificate you give it, Let's Encrypt, or one it
# makes itself. With your settings in .env (see .env.example), through docker/compose.sh, which
# runs Docker's compose or Podman's as CONTAINER_ENGINE says:
#
#   docker/compose.sh up -d --build                         # self-signed, or your own certificate
#   docker/compose.sh --profile letsencrypt up -d --build   # Let's Encrypt
#
# `docker compose` and `podman compose` take this file as it is too. Bind mounts carry :z, which
# relabels them for SELinux on Podman's usual hosts and changes nothing elsewhere. See
# docs/docker.md.
name: chainv4

services:
  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: chainv4:latest
    restart: unless-stopped
    environment:
      TOR: ${TOR:-0}
      CHAIN_CONSENSUS: ${CHAIN_CONSENSUS:-authority}
      CHAIN_FINALITY: ${CHAIN_FINALITY:-ffg}
      CHAIN_FEES: ${CHAIN_FEES:-base-fee}
      BLOCKS: ${BLOCKS:-auto}
      VALIDATE: ${VALIDATE:-auto}
      PRODUCER_KEY: ${PRODUCER_KEY:-}
      VALIDATOR_KEY: ${VALIDATOR_KEY:-}
      REWARD_TO: ${REWARD_TO:-}
      MINE_THREADS: ${MINE_THREADS:-1}
      MINING_TOKEN: ${MINING_TOKEN:-}
      POOL: ${POOL:-0}
      POOL_OPEN: ${POOL_OPEN:-0}
      POOL_FEE: ${POOL_FEE:-0}
      POOL_WINDOW: ${POOL_WINDOW:-2}
      POOL_PUSH: ${POOL_PUSH:-}
      POOL_PUSH_KEY: ${POOL_PUSH_KEY:-}
      PROTOCOL: ${PROTOCOL:-}
      UPDATES: ${UPDATES:-}
      PEERS: ${PEERS:-}
      BOOTNODES: ${BOOTNODES:-}
      INDEX_EVENTS: ${INDEX_EVENTS:-genesis}
      INDEX_ADDRESSES: ${INDEX_ADDRESSES:-genesis}
      FAUCET_KEY: ${FAUCET_KEY:-}
      FAUCET_AMOUNT: ${FAUCET_AMOUNT:-10}
      FAUCET_EVERY: ${FAUCET_EVERY:-24h}
      FAUCET_WORK: ${FAUCET_WORK:-20}
      SWAP_CONTRACT: ${SWAP_CONTRACT:-}
      DEX_CONTRACT: ${DEX_CONTRACT:-}
      DEX_ROUTER: ${DEX_ROUTER:-}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    volumes:
      - chain:/data
      # The node's onion, as tor writes it, with TOR=1.
      - onion:/onion:ro
      # A genesis.json to start from, producer.key and validator.key to sign with,
      # mining.token for workers to mine with, and faucet.key for a faucet to pay from.
      - ./config:/config:ro,z
    # Peer-to-peer goes straight to the node: QUIC is TLS 1.3 already, with keys bound to peer ids.
    ports:
      - "${P2P_PORT:-4001}:4001/udp"
      # Workers, when there is a mining.token: their messages are authenticated with it.
      - "${MINING_PORT:-4002}:4002/tcp"
    # The image's own, here too: an image Podman builds in OCI's format keeps no HEALTHCHECK.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/status > /dev/null || exit 1"]
      interval: 10s
      start_period: 20s

  nginx:
    build: nginx
    image: chainv4-nginx:latest
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      TLS_MODE: ${TLS_MODE:-self-signed}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - tls:/etc/chainv4/tls
      - ./certs:/etc/chainv4/provided:ro,z
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro

  # Only with --profile tor: the node as an onion service (docker/tor).
  tor:
    build: tor
    image: chainv4-tor:latest
    profiles: [tor]
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      TOR_MINING: ${TOR_MINING:-0}
      MINING_PORT: ${MINING_PORT:-4002}
      P2P_PORT: ${P2P_PORT:-4001}
    volumes:
      - tor:/var/lib/tor
      - onion:/onion

  # Only with --profile letsencrypt.
  certbot:
    image: docker.io/certbot/certbot:v5.8.0
    profiles: [letsencrypt]
    restart: unless-stopped
    depends_on:
      - nginx
    entrypoint: ["/bin/sh", "/run.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - ./certbot/run.sh:/run.sh:ro,z
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot

volumes:
  chain:
  tor:
  onion:
  tls:
  letsencrypt:
  acme:
