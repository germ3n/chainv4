# The validity proofs' programs for SP1, built for SP1's RISC-V by ../build.sh, run by chainv4
# prove: chainv4-proof-program (src/main.rs), chainv4's own replay of a range of blocks
# (proofs::replay); chainv4-finality-program, a link of finality; and chainv4-headers-program, the
# header chain. Each one's verifying key is the program governance names for it in Change::Proofs:
# any change to how blocks run is another program.
[package]
name = "chainv4-proof-program"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sp1-zkvm = "=6.10.0"
chainv4 = { path = "../../..", default-features = false, features = ["consensus"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
