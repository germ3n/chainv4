# What xbuild builds the Android app from: x build --platform android, or build-android.sh. The rest
# of the app's manifest is xbuild's own: a NativeActivity that loads libchainv4_wallet.so, targeting
# API 33.
#
# Plain-HTTP nodes need nothing more: Android's cleartext rule binds Java's networking, and the
# wallet talks to nodes from Rust over sockets of its own.
icon: assets/icon.png
android:
  manifest:
    package: org.chainv4.wallet
    # Android 7 and up: xbuild signs with APK Signature Scheme v2 alone, which older ones do not read.
    sdk:
      min_sdk_version: 24
    uses_permission:
      - name: android.permission.INTERNET
      # Unlocking with a fingerprint or face, and confirming sends with one: a normal permission,
      # granted as the app is installed.
      - name: android.permission.USE_BIOMETRIC
    application:
      label: chainv4 wallet
      # No action bar: the app never draws one, but Android would keep room for it all the same.
      theme: "@android:style/Theme.DeviceDefault.NoActionBar"
      # The file picker, a Java activity ui/build-android.sh compiles into the APK: each line marked
      # "# picker" goes when it builds without one, as Android refuses an app that declares code it
      # does not hold. The first activity is the app, which xbuild makes the NativeActivity.
      has_code: true # picker
      activities: # picker
        - {} # picker
        - name: org.chainv4.ui.Picker # picker
          exported: false # picker
          config_changes: "orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|uiMode|density" # picker
