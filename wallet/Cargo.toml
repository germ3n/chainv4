[package]
# Named apart from its binary, `wallet`: the library's file and the binary's would otherwise
# collide in a wasm32 build. xbuild names the Android app's library after the package.
name = "chainv4-wallet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A chainv4 light wallet: keys sealed with a password, and balances, tokens and receipts it proves itself, trusting only a genesis. Runs as a desktop app, in the browser, and on Android."

# The app is a library, as Android loads it; the binary runs it on the desktop and in the browser.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
# Only the parts that build for the browser too: transactions, keys, hashes and the light client.
chainv4 = { path = "..", default-features = false, features = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "mnemonic", "abi"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.37.0"
# The look's widgets, talking to the node through a proxy, and running on Android, shared with the
# explorer.
chainv4-ui = { path = "../ui" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1.1.0"
wincode = "0.6.3"
# Sealing keys with a password: Argon2id to stretch it, ChaCha20-Poly1305 to seal.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# Wiping keys, the vault opened and passwords typed from memory once done with.
zeroize = "1.9.1"
getrandom = "0.4"
qrcode = { version = "0.14.1", default-features = false }
# Reading QR codes off photos, for signing on a device that never goes online: JPEG and PNG
# decoded in Rust, alike on every platform, and rqrr to find and read the codes in them.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rqrr = { version = "0.11.0", default-features = false }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "wayland", "x11"] }
env_logger = "0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "Window"] }
# MetaMask, through the page's window.ethereum: requests made and promises awaited from Rust.
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"

# Android runs it in a NativeActivity: no Java of its own, and chainv4-ui does the rest.
# accesskit does not work with one.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }

# A workspace of its own, as the explorer is: egui and the browser crates never meet the node's
# lockfile.
[workspace]
