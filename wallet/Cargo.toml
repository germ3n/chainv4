[package]
# Named apart from its binary, `wallet`: the library's file and the binary's would otherwise
# collide in a wasm32 build. xbuild names the Android app's library after the package.
name = "chainv4-wallet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A chainv4 light wallet: keys sealed with a password, and balances, tokens and receipts it proves itself, trusting only a genesis. Runs as a desktop app, in the browser, on Android and on iOS."

# The app is a library, as Android loads it; the binary runs it on the desktop and in the browser.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wallet"
path = "src/main.rs"

# The browser's Web Worker that mines on the CPU, which trunk builds beside the app: natively it
# does nothing, and a build without mining has none.
[[bin]]
name = "miner-worker"
path = "src/bin/miner-worker.rs"
required-features = ["mining"]

[dependencies]
# Only the parts that build for the browser too: transactions, keys, hashes and the light client,
# and checking releases against the keys built in.
chainv4 = { path = "..", default-features = false, features = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "bitcoin", "mnemonic", "sealed-keys", "abi", "release"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "persistence"] }
egui = "0.37.0"
# The look's widgets, talking to the node through a proxy, and running on Android, shared with the
# explorer.
chainv4-ui = { path = "../ui", features = ["camera", "blocks"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1.1.0"
wincode = "0.6.3"
# Sealing keys with a password: Argon2id to stretch it, ChaCha20-Poly1305 to seal.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# Joining a stretched password and a secret held in hardware into one key, for a wallet that needs
# both to open: HKDF over SHA-256.
hkdf = "0.13"
sha2 = "0.11"
# Wiping keys, the vault opened and passwords typed from memory once done with.
zeroize = "1.9.1"
getrandom = "0.4"
qrcode = { version = "0.14.1", default-features = false }
# Reading QR codes off photos, for signing on a device that never goes online: JPEG and PNG
# decoded in Rust, alike on every platform, and rqrr to find and read the codes in them.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# NFT pictures in SVG, drawn from their bytes alone: no text, no fonts and no images they point at,
# so a picture can make no request and read no file.
resvg = { version = "=0.48.1", default-features = false }
rqrr = { version = "0.11.0", default-features = false }
ur = "0.5.2"
minicbor = { version = "2", default-features = false, features = ["alloc"] }

[features]
default = ["store", "mining"]
# All an app store takes: every default feature but mining. --store on the build scripts builds with
# this alone: cargo build --no-default-features --features store.
store = ["swap", "dex", "nft", "bridge", "bitcoin-light", "walletconnect"]
# Mining from this device, on its GPU or CPU, and in the browser on WebGPU or Web Workers: the Mine
# card, crate::miner, and what they rest on. Off for the app stores, which take no app that mines;
# what a pool owes and claiming it stay, as claiming is not mining.
mining = ["chainv4/worker", "chainv4/gpu-mining", "dep:chainv4-gpu"]
# Atomic swaps between this chain, Bitcoin and EVM chains: the Swaps page, and the offline signer
# signing a swap's Bitcoin side.
swap = ["chainv4/swap"]
# The Trade page: swaps of tokens on the DEXes, and their pools.
dex = ["chainv4/dex"]
# The NFTs page: what the accounts hold of the chain's collections, proven, with their pictures
# once Settings lets the wallet fetch them, and sending them.
nft = ["chainv4/nft"]
# The Bridge page: the coin, tokens and NFTs to and from EVM chains through the gateways, and BTC
# in and out as wBTC, deposits shown by the light client's proofs.
bridge = ["swap", "chainv4/bridge", "chainv4-ui/bridge"]
# A Bitcoin light client on the desktop and Android: BIP157/158 compact block filters from Bitcoin's
# own peers, through Kyoto (the bip157 crate), for swaps' HTLCs and the accounts' Bitcoin
# addresses. The browser, which opens no raw connections, goes without.
bitcoin-light = ["dep:bip157", "dep:bitcoin"]
# Sites on the desktop and Android through WalletConnect v2, which have no extension: a relay over
# wss:// (chainv4's own client, through the proxy), X25519 and ChaCha20-Poly1305 between the wallet
# and the site. Off until Settings names a project.
walletconnect = ["chainv4/worker", "dep:curve25519-dalek", "dep:bs58", "dep:base64"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Contract reads run here over the state the node proves (chainv4_ui::rerun), with the chain's own
# engines. The browser has no Lua engine, and takes the node's answer.
chainv4-ui = { path = "../ui", features = ["rerun"] }

# The form the wallet store writes its files in, as eframe writes its own.
ron = "0.12.2"
# The GPUs there are, by name, for the Mining page to pick from, and mining on them as well as on
# the CPU: wgpu on Vulkan, Metal or DX12.
chainv4-gpu = { path = "../gpu", optional = true }
bip157 = { version = "0.8.0", optional = true }
curve25519-dalek = { version = "=5.0.0", optional = true }
bs58 = { version = "=0.5.1", optional = true }
base64 = { version = "=0.23.1", optional = true }
bitcoin = { version = "0.32.8", default-features = false, features = ["std"], optional = true }

# glow everywhere but iOS: eframe builds with a renderer only.
[target.'cfg(not(target_os = "ios"))'.dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow"]

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "wayland", "x11"] }
env_logger = "0.11.11"

# iOS draws through Metal, wgpu's, as Apple has deprecated OpenGL there; chainv4-ui does the rest.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit"] }
# Mining in the browser on its GPU, through WebGPU.
chainv4-gpu = { path = "../gpu", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.58"
# The page, and for mining the node's WebSocket and the Web Workers that hash on the CPU.
web-sys = { version = "0.3.85", features = ["CloseEvent", "DedicatedWorkerGlobalScope", "Document", "Element", "HtmlCanvasElement", "Location", "MessageEvent", "Navigator", "UrlSearchParams", "WebSocket", "Window", "Worker"] }
# MetaMask, through the page's window.ethereum: requests made and promises awaited from Rust.
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"

# Android runs it in a NativeActivity: no Java of its own, and chainv4-ui does the rest.
# accesskit does not work with one.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }

# The end-to-end tests drive the whole app headlessly, through what accesskit sees of it.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["eframe"] }

# A workspace of its own, as the explorer is: egui and the browser crates never meet the node's
# lockfile.
[workspace]
