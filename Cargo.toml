[package]
name = "chainv4"
version = "0.2.0"
edition = "2024"
license = "MIT"

[package.metadata.consensus]
# The Luau fork's commit, which Cargo.lock's luau0-src must be (tests/toolchains.rs).
luau0-src = "8c1973741bae634cd80e0adec620fd4e55f7d86a"

[workspace]
members = ["macro", "wiki", "gpu", "ethlight", "btclight"]
# Contracts build for wasm32, the explorer for the desktop and the browser, and the validity
# proofs' program for SP1's RISC-V; each has a workspace of its own, so none shares the node's
# lockfile.
exclude = ["contracts", "explorer", "proofs/sp1/program"]

[features]
default = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "bls12-381", "bitcoin", "anchoring", "anchoring-btc", "anchoring-eth", "swap", "mnemonic", "sealed-keys", "lvm", "wasm", "evm", "rocksdb", "node", "http", "stream", "client", "finality-ffg", "finality-authority", "finality-depth", "governance-electorate", "governance-council", "names", "ethereum", "abi", "faucet", "dex", "nft", "bridge", "pool", "updates", "sp1"]
sha256 = ["dep:sha2"]
blake3 = ["dep:blake3"]
blake2s = ["dep:blake2"]
blake2b = ["dep:blake2"]
xxh3 = ["dep:xxhash-rust"]
keccak256 = ["dep:sha3"]
ed25519 = []
edblake = ["dep:blake3", "dep:digest", "dep:curve25519-dalek", "ed25519-dalek/hazmat"]
# Ethereum's keys: ECDSA on secp256k1 over keccak256, and addresses of keccak256's last 20 bytes.
secp256k1 = ["dep:k256", "dep:sha3"]
# BLS signatures over BLS12-381 as Ethereum's consensus layer makes them: FastAggregateVerify with
# the ciphersuite BLS_SIG_BLS12381G2_XMD:SHA-256_SSWU_RO_POP_, for contracts following its sync
# committees (contracts/examples/eth_relay). zkcrypto's bls12_381, in pure Rust; its hash to G2
# takes digest 0.10's SHA-256.
bls12-381 = ["dep:bls12_381", "dep:sha2-010"]
# Bitcoin's keys: ECDSA on secp256k1 over double SHA-256, and addresses of the key's HASH160,
# written bc1q… as Bitcoin's native segwit (P2WPKH) ones are.
bitcoin = ["secp256k1", "dep:sha2", "dep:ripemd", "dep:hmac"]
# Anchoring the chain's finalized checkpoints into other chains (docs/anchoring.md), whichever
# they are: the anchor list and its root, Tx::Anchor's dispatch and reward, the guard against
# branches leaving an enforced anchored checkpoint, GET /anchors, serving anchors to peers, and
# --anchored, which compares the histories peers show. Without it, the types stay, so encodings do
# not change, but the node takes no anchors, serves none and enforces none.
anchoring = ["dep:sha2"]
# Anchors in Bitcoin: Tx::Anchor's Bitcoin proofs, read against the Bitcoin relay's records,
# Bitcoin's headers checked by work for --anchored, served to peers, and bridge btc anchor; on the
# header rules btclight shares with contracts/examples/btc_relay.
anchoring-btc = ["anchoring", "bitcoin", "dep:btclight"]
# Anchors in Ethereum, on the light client ethlight shares with contracts/examples/eth_relay:
# Tx::Anchor's Ethereum proofs, read against the Ethereum relay's records with its sync committees'
# BLS signatures checked, --anchored checking them against committees followed from a beacon API
# (--beacon), and the anchorer writing anchors to Ethereum. ethlight itself is in every build, as
# anchoring's settings name a beacon network every node must read alike.
anchoring-eth = ["anchoring", "bls12-381"]
# Atomic swaps between any two of chainv4, Bitcoin and EVM chains: the terms both sides agree, as
# ur:chainv4-swap codes, Bitcoin's HTLC script and its spends, and Swap.sol's calls. chainv4's side
# is a contract, contracts/lua/swap.lua; an EVM chain's, contracts/evm/Swap.sol.
swap = ["bitcoin", "dep:ur"]
# The DEX's arithmetic for the apps: the trade formula and routes through pools, quoting
# contracts/lua/dex.lua and the EVM's contracts/evm/Dex.sol alike, and the node naming them.
dex = []
# NFTs for the apps: where a collection's token_uri leads and the metadata it names, and the CLI's
# chainv4 nft. The collection registry itself is consensus, in every build.
nft = ["json"]
# Bridges for the apps and the federation's tools: transfers as the gateways hash and the signers
# sign them, and the CLI's chainv4 bridge. The gateways and the federation are contracts and
# consensus, in every build.
bridge = ["abi", "secp256k1", "keccak256"]
# Seed phrases: BIP39 words, SLIP-0010 for the Edwards schemes and BIP32 for secp256k1.
mnemonic = ["dep:bip39", "dep:hmac", "dep:sha2", "dep:ripemd"]
# Key files sealed under a passphrase (src/crypto/sealed.rs): Argon2id and XChaCha20-Poly1305.
sealed-keys = ["dep:argon2", "dep:chacha20poly1305", "dep:libc"]
vm = ["xxh3"]
lvm = ["vm", "dep:mlua"]
wasm = ["vm", "dep:wasmi"]
# The Ethereum Virtual Machine, on revm in pure Rust: its precompiles take k256 and arkworks, not C.
# EVM accounts are 20 bytes, keccak256's, so it needs keccak256.
evm = ["vm", "keccak256", "abi", "dep:revm"]
# Solidity's ABI: encoding calls and decoding results and logs, every type, from a contract's JSON
# ABI, for the CLI and the apps; and EVM and CREATE addresses, worked out without an EVM.
abi = ["keccak256", "json"]
rocksdb = ["dep:rocksdb", "dep:self_cell"]
http = ["dep:axum", "dep:http-body-util", "json", "node"]
# A faucet for dev and test chains: the node's --faucet-key pays POST /faucet, a drip per address
# and per IP each window, each asked with a moment's proof of work (src/faucet.rs).
faucet = ["http", "sha256"]
# GET /stream: what a node does, pushed to clients as it happens. A node only streams when started
# with --stream.
stream = ["http", "dep:tokio-stream"]
# The client side of the CLI: chainv4 send talks to a node's HTTP API.
client = ["dep:ureq", "ureq/socks-proxy", "json", "node"]
# Kinds of finality a node can run, as genesis picks: bonded validators voting (FFG), a fixed set
# of signers voting, or a number of blocks on top.
finality-ffg = ["staking"]
finality-authority = []
finality-depth = []
# Kinds of governance a chain can run, as genesis picks: finality's own electorate approving
# changes, or a council of accounts genesis names.
governance-electorate = ["governance"]
governance-council = ["governance"]
# Validators bonding funds, which FFG finality votes with: Tx::Bond, Unbond, Withdraw and Slash's
# taking of bonds, the validator registry and its API routes. FFG brings it.
staking = []
# Changing what genesis set by transaction: Tx::ApproveChange and WithdrawChange, the change
# registry and GET /governance. Either kind of governance brings it.
governance = []
# Ethereum's JSON-RPC, at POST /rpc, for MetaMask, Foundry and ethers, and the index of
# Ethereum-signed transactions by their keccak256 it answers from. Checking and running those
# transactions is every node's, with secp256k1 and evm, whatever it serves.
ethereum = ["evm", "secp256k1", "http"]
# The name registry: names such as alice.dev, Tx::Name and PrimaryName, GET /names, chainv4 send
# name, and resolving names from contracts. Unicode names normalize as ENS's do, by ENSIP-15.
names = ["unicode-names"]
# Checking and normalizing Unicode names by ENSIP-15 alone, without the registry: what the apps
# take, so a name they let you type is one the chain takes.
unicode-names = ["dep:ens-normalize"]
# Mining on the GPU, through wgpu: Vulkan, Metal and WebGPU. --mine-gpu picks it over the threads.
gpu = ["gpu-mining", "node"]
# A worker's GPUs without the node: Rig::gpu, for an app that mines, such as the wallet.
gpu-mining = ["dep:chainv4-gpu", "dep:log"]
# Mining for a node from elsewhere, keeping no chain: the mining port's protocol, a worker on CPU
# threads (or GPUs with gpu-mining) and the pool claims it keeps. The node brings it; the wallet
# mines with it alone.
worker = ["json", "dep:hmac", "dep:sha2", "dep:log", "dep:rustls", "dep:webpki-roots", "dep:tungstenite"]
# Running a mining pool on the mining port: workers' shares at easier difficulties, set for each
# one's hashrate, and every block split among the last window of them (PPLNS) with --pool, an
# open port with --mining-open, and GET /pool. Without it the port mines for --reward-to alone;
# blocks that split their reward import either way.
pool = ["node"]
# Genesis as JSON, and each change under governance (chain::json): what genesis files, the API and
# the apps read and write.
json = ["dep:serde_json"]
# SP1's validity proofs checked: its Groth16 proofs, by sp1-verifier, pure Rust and no_std, for a
# node's Tx::Prove and the apps' proven tip. Proving them is the CLI's sp1-prover, never a node's.
sp1 = ["dep:sp1-verifier"]
# Proving ranges with SP1 on this machine, by hand: chainv4 prove. SP1's SDK, its prover and its
# Groth16 wrapping, heavy and off by default; no node or app needs it.
sp1-prover = ["sp1", "chain", "secp256k1", "client", "dep:sp1-sdk"]
# Everything that decides how a block runs, without the node: what the validity proofs' program
# builds chainv4 with, so it runs blocks as a node of the default build does. A feature added that
# changes how blocks run goes here too.
consensus = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "bls12-381", "bitcoin", "anchoring", "anchoring-btc", "anchoring-eth", "lvm", "wasm", "evm", "abi", "chain", "finality-ffg", "finality-authority", "finality-depth", "governance-electorate", "governance-council", "names", "sp1"]
# The chain itself, its state transition, without the node around it: what a validity proof runs.
chain = ["json", "dep:log", "lvm"]
# Releases for the apps and tools (docs/updates.md): the signed manifest of the newest chainv4,
# wallet and explorer, checked against the release keys built in, and putting a downloaded binary
# in place.
release = ["json", "sha256"]
# A node fetching releases with --updates and serving them at GET /release, warning while it is
# behind and stopping at an upgrade it is too old for; --auto-update, and chainv4 update.
updates = ["release", "client", "ureq/socks-proxy"]
node = ["chain", "dep:rayon", "dep:signal-hook", "dep:libp2p", "dep:tokio", "dep:clap", "dep:log", "dep:env_logger", "json", "dep:hmac", "dep:sha2", "lvm", "rocksdb", "worker"]

[dependencies]
# ENSIP-15, ENS's normalization of names against look-alikes, for Unicode names (src/registry/names.rs).
ens-normalize = { version = "=0.1.1", optional = true }
rocksdb = { version = "0.25.0", optional = true }
sp1-verifier = { version = "=6.10.0", default-features = false, optional = true }
sp1-sdk = { version = "=6.10.0", features = ["blocking", "native-gnark"], optional = true }
# A RocksDB snapshot owned with the database it reads, for the API's point-in-time reads.
self_cell = { version = "1.2.0", optional = true }
blake3 = { version = "1.8.7", optional = true }
blake2 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
sha3 = { version = "0.12.0", optional = true }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"], optional = true }
bip39 = { version = "3.0.0", default-features = false, features = ["std", "zeroize"], optional = true }
hmac = { version = "0.13.0", optional = true }
# Ethereum's BLS signatures: hash to G2 and the pairing are behind experimental and pairings.
bls12_381 = { version = "0.9.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"], optional = true }
sha2-010 = { package = "sha2", version = "0.10.9", default-features = false, optional = true }
# HASH160's second half, for BIP32 key fingerprints: what an extended public key names its parent by.
ripemd = { version = "0.2.0", default-features = false, optional = true }
wincode = { version = "0.6.3", features = ["derive"] }
macro = { path = "macro" }
chainv4-gpu = { path = "gpu", optional = true }
xxhash-rust = { version = "0.8.19", features = ["xxh3"], optional = true }
ed25519-dalek = "3.0.0"
curve25519-dalek = { version = "5.0.0", optional = true }
digest = { version = "0.11.3", optional = true }
getrandom = "0.4.3"
ur = { version = "0.5.2", optional = true }
zeroize = "1.9.1"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"], optional = true }
ethnum = "1.5.3"
# Bitcoin's header rules, shared with contracts/examples/btc_relay.
btclight = { path = "btclight", optional = true }
# Ethereum's light client, shared with contracts/examples/eth_relay.
ethlight = { path = "ethlight" }
rayon = { version = "1.12.0", optional = true }
libp2p = { version = "0.57.1", features = ["tokio", "quic", "tcp", "noise", "yamux", "gossipsub", "kad", "mdns", "identify", "request-response", "macros"], optional = true }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util"], optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
log = { version = "0.4.34", optional = true }
env_logger = { version = "0.11.11", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"], optional = true }
# What holds a request body to the chain's largest transaction as it reads, axum's own.
http-body-util = { version = "0.1.5", optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
# The interpreter is consensus: an upgrade can change what a module costs, so it is pinned.
revm = { version = "43.0.3", default-features = false, features = ["std", "optional_fee_charge", "optional_no_base_fee", "optional_block_gas_limit", "memory_limit"], optional = true }
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"], optional = true }
# Lua is consensus too, so the forks are pinned by commit: mlua by its rev here, and Luau, which
# mlua-sys takes from its fork's main, by the commit below, which tests/toolchains.rs holds
# Cargo.lock to, so a `cargo update` cannot move either.
mlua = { git = "https://github.com/germ3n/mlua", rev = "fab23f8c42ab50b50f19acb1a8c429e91f3a44eb", features = ["luau", "send"], optional = true }
# Stopping cleanly on SIGTERM and SIGINT: as a container's PID 1, nothing else would.
signal-hook = { version = "0.3.18", optional = true }

# A worker reaching an open mining port over wss:// (src/mining/wss.rs): what ureq's TLS is made of,
# and the WebSocket axum's relay already speaks. A browser's own WebSocket needs none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"], optional = true }

# Turning a terminal's echo off while a sealed key's passphrase is typed (src/cli/mod.rs).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
wat = "1.262.0"
# The Ethereum light client's rules, with the synthetic sync committees its tests sign with.
ethlight = { path = "ethlight", features = ["testing"] }
# Tests read JSON whatever features the build has.
serde_json = "1.0.154"
# A WebSocket client, mining over GET /mining/ws as a browser does.
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }

[build-dependencies]
wiki = { path = "wiki" }


# Luau's C++ optimized in debug builds too. Unoptimized, each C boundary a contract nests through,
# a table.sort comparator or a gsub callback calling back in, takes about 10 KB of stack, and the
# 200 Luau allows overflow a test thread's 2 MiB; optimized, as a node runs it, they fit in under
# 512 KiB. Tests run then as a node does, and faster.
# mlua-sys's build script compiles it, so its level is the one cc reads.
[profile.dev.package.mlua-sys]
opt-level = 2

[profile.dev.package.luau0-src]
opt-level = 2

# SP1's executor is slow unoptimized, and the proofs' tests run it: optimized even in dev builds.
[profile.dev.package.sp1-core-executor]
opt-level = 3
[profile.dev.package.sp1-core-executor-runner]
opt-level = 3
[profile.dev.package.sp1-primitives]
opt-level = 3
[profile.dev.package.sp1-hypercube]
opt-level = 3
