[package]
name = "chainv4"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["macro", "wiki", "gpu"]
# Contracts build for wasm32, and the explorer for the desktop and the browser; each has a
# workspace of its own, so neither shares the node's lockfile.
exclude = ["contracts", "explorer"]

[features]
default = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "mnemonic", "lvm", "wasm", "rocksdb", "node", "http", "stream", "client", "finality-ffg", "finality-authority", "finality-depth", "governance-electorate", "governance-council"]
sha256 = ["dep:sha2"]
blake3 = ["dep:blake3"]
blake2s = ["dep:blake2"]
blake2b = ["dep:blake2"]
xxh3 = ["dep:xxhash-rust"]
keccak256 = ["dep:sha3"]
ed25519 = []
edblake = ["dep:blake3", "dep:digest", "dep:curve25519-dalek", "ed25519-dalek/hazmat"]
# Ethereum's keys: ECDSA on secp256k1 over keccak256, and addresses of keccak256's last 20 bytes.
secp256k1 = ["dep:k256", "dep:sha3"]
# Seed phrases: BIP39 words, SLIP-0010 for the Edwards schemes and BIP32 for secp256k1.
mnemonic = ["dep:bip39", "dep:hmac", "dep:sha2"]
vm = ["xxh3"]
lvm = ["vm", "dep:mlua"]
wasm = ["vm", "dep:wasmi"]
rocksdb = ["dep:rocksdb"]
http = ["dep:axum", "dep:serde_json", "node"]
# GET /stream: what a node does, pushed to clients as it happens. A node only streams when started
# with --stream.
stream = ["http", "dep:tokio-stream"]
# The client side of the CLI: chainv4 send talks to a node's HTTP API.
client = ["dep:ureq", "dep:serde_json", "node"]
# Kinds of finality a node can run, as genesis picks: bonded validators voting (FFG), a fixed set
# of signers voting, or a number of blocks on top.
finality-ffg = []
finality-authority = []
finality-depth = []
# Kinds of governance a chain can run, as genesis picks: finality's own electorate approving
# changes, or a council of accounts genesis names.
governance-electorate = []
governance-council = []
# Mining on the GPU, through wgpu: Vulkan, Metal and WebGPU. --mine-gpu picks it over the threads.
gpu = ["dep:chainv4-gpu", "node"]
node = ["dep:rayon", "dep:libp2p", "dep:tokio", "dep:clap", "dep:log", "dep:env_logger", "dep:serde_json", "lvm", "rocksdb"]

[dependencies]
rocksdb = { version = "0.25.0", optional = true }
blake3 = { version = "1.8.7", optional = true }
blake2 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
sha3 = { version = "0.12.0", optional = true }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"], optional = true }
bip39 = { version = "3.0.0", default-features = false, features = ["std"], optional = true }
hmac = { version = "0.13.0", optional = true }
wincode = { version = "0.6.3", features = ["derive"] }
macro = { path = "macro" }
chainv4-gpu = { path = "gpu", optional = true }
xxhash-rust = { version = "0.8.19", features = ["xxh3"], optional = true }
ed25519-dalek = "3.0.0"
curve25519-dalek = { version = "5.0.0", optional = true }
digest = { version = "0.11.3", optional = true }
getrandom = "0.4.3"
zeroize = "1.9.1"
ethnum = "1.5.3"
rayon = { version = "1.12.0", optional = true }
libp2p = { version = "0.57.1", features = ["tokio", "quic", "gossipsub", "kad", "mdns", "identify", "request-response", "macros"], optional = true }
tokio = { version = "1.54.1", features = ["rt", "net", "sync", "time", "macros"], optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
log = { version = "0.4.34", optional = true }
env_logger = { version = "0.11.11", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
ureq = { version = "3.4.2", default-features = false, optional = true }
# The interpreter is consensus: an upgrade can change what a module costs, so it is pinned.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"], optional = true }
mlua = { git = "https://github.com/germ3n/mlua", branch = "main", features = ["luau", "send"], optional = true }

[dev-dependencies]
wat = "1.262.0"

[build-dependencies]
wiki = { path = "wiki" }
