[package]
name = "chainv4-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "What chainv4's egui apps share: a palette, type and density each app picks for its own look, the widgets their pages are built from, and running on Android."

[dependencies]
# glow, as both apps render with it: eframe builds with a renderer only.
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
egui = "0.37.0"
log = "0.4.34"
# Names for biometric keys, and the passkey salt in the browser.
getrandom = "0.4"
# Wiping the secrets biometrics keep from memory once they are done with.
zeroize = "1.9.1"

# Talking to a node: ureq on the desktop and Android, where a proxy set in an app is the only way
# out, SOCKS5 included; the browser's fetch in the browser, where its own proxy settings apply.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["gzip", "socks-proxy"] }

[features]
default = ["tls"]
# Nodes at https://, through rustls, whose ring is C: the ui workflow lints Android without it, as
# it has no Android sysroot, and the apps, built with one, always have it.
tls = ["ureq/rustls"]

# Picking files: a native dialog on the desktop, the browser's in the browser.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = "0.17.2"
wasm-bindgen-futures = "0.4.58"
ehttp = { version = "0.7.2", features = ["streaming"] }
# Biometrics in the browser: a passkey, through WebAuthn and its PRF extension, whose output wraps
# the secret.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.85"
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3.85", features = ["Window", "Navigator", "CredentialsContainer", "Location"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }

# Biometrics on macOS: Touch ID through LocalAuthentication, and the secret in the Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSData"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6.2"
security-framework = "3.5.1"

# Android runs an app in a NativeActivity: no Java of its own.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
# Copying and pasting through Android's ClipboardManager, as egui-winit reaches no clipboard there,
# and picking files through the APK's own Java activity.
jni = "0.22.4"
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

# A workspace of its own, as the wallet and the explorer are, which use it by path.
[workspace]
