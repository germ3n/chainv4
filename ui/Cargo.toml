[package]
name = "chainv4-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "What chainv4's egui apps share: a palette, type and density each app picks for its own look, the widgets their pages are built from, and running on Android and iOS."

[dependencies]
# A node's stream carries JSON (sse.rs).
serde_json = "1.0.154"
eframe = { version = "0.37.0", default-features = false }
egui = "0.37.0"
log = "0.4.34"
# Names for biometric keys, and the passkey salt in the browser.
getrandom = "0.4"
# Wiping the secrets biometrics keep from memory once they are done with.
zeroize = "1.9.1"
# Checking blocks a node sends, and what a reading keeps of where it got to.
chainv4 = { path = "..", default-features = false, features = ["sha256", "blake3", "blake2s", "blake2b", "xxh3", "keccak256", "ed25519", "edblake", "secp256k1", "bitcoin", "abi"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
wincode = { version = "0.6.3", optional = true }

# Talking to a node: ureq on the desktop and Android, where a proxy set in an app is the only way
# out, SOCKS5 included; the browser's fetch in the browser, where its own proxy settings apply.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["gzip", "socks-proxy"] }

[features]
default = ["tls"]
# Nodes at https://, through rustls, whose ring is C: the ui workflow lints Android without it, as
# it has no Android sysroot, and the apps, built with one, always have it.
tls = ["ureq/rustls"]
# Reading blocks a node sends, each checked against the headers a light client followed, and keeping
# an index on a shelf, in files or in IndexedDB (src/blocks.rs, src/shelf.rs): what the wallet and the
# explorer read a chain by when told to rest on nothing else. Off by default, as chainv4 is C by way of
# blake3 on Android, which the ui workflow has no sysroot for.
blocks = ["dep:chainv4", "dep:serde", "dep:wincode", "web-sys/IdbFactory", "web-sys/IdbDatabase", "web-sys/IdbOpenDbRequest", "web-sys/IdbRequest", "web-sys/IdbObjectStore", "web-sys/IdbTransaction", "web-sys/IdbTransactionMode", "web-sys/DomException", "web-sys/DomStringList", "web-sys/Event", "web-sys/EventTarget"]
# A live camera, for reading QR codes as they are shown (src/camera.rs): nokhwa on the desktop,
# getUserMedia in the browser, the APK's Camera2 class on Android. The wallet has it; the explorer
# reads no codes.
camera = ["dep:nokhwa", "web-sys/MediaDevices", "web-sys/MediaStream", "web-sys/MediaStreamConstraints", "web-sys/MediaStreamTrack", "web-sys/HtmlVideoElement", "web-sys/HtmlCanvasElement", "web-sys/CanvasRenderingContext2d", "web-sys/ImageData", "web-sys/Document", "web-sys/Element", "web-sys/HtmlElement", "web-sys/Node"]

# glow everywhere but iOS, as the apps render with it: eframe builds with a renderer only.
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }

# iOS draws through Metal, wgpu's: Apple has deprecated OpenGL there.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIPasteboard", "UIApplication", "UIResponder", "UIViewController", "UIView", "UIWindow", "UIScene", "UIWindowScene", "UISceneDefinitions", "UIDocumentPickerViewController", "UIDevice", "UIImagePickerController", "UIImage", "UINavigationController", "UISceneOptions", "UISceneSession", "UIGeometry", "UIColor", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "AVCaptureSession", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVMediaFormat", "AVCaptureSessionPreset"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
dispatch2 = "0.3.0"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
# winit's window, which iOS 27 shows only once it is the scene's (src/ios.rs).
raw-window-handle = "0.6.2"

# Picking files: a native dialog on the desktop, the browser's in the browser.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17.2"
# The camera on the desktop: AVFoundation on macOS, V4L2 on Linux, Media Foundation on Windows,
# with MJPEG frames decoded.
nokhwa = { version = "0.10.11", optional = true, features = ["input-native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = "0.17.2"
wasm-bindgen-futures = "0.4.58"
ehttp = { version = "0.7.2", features = ["streaming"] }
# Biometrics in the browser: a passkey, through WebAuthn and its PRF extension, whose output wraps
# the secret.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.85"
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3.85", features = ["Window", "Navigator", "CredentialsContainer", "Location"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }

# Biometrics on macOS and iOS: Touch ID or Face ID through LocalAuthentication, and the secret in
# the Keychain.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSData", "NSArray", "NSURL", "NSObject", "NSValue", "NSDictionary", "NSPathUtilities", "NSSet"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }
block2 = "0.6.2"
security-framework = "3.5.1"

# On iOS a secret kept for a wallet that needs biometrics to open is a Keychain item tied to them,
# and its query is written in Core Foundation's own terms.
[target.'cfg(target_os = "ios")'.dependencies.core-foundation]
version = "0.10"

# Android runs an app in a NativeActivity: no Java of its own.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
# Copying and pasting through Android's ClipboardManager, as egui-winit reaches no clipboard there,
# and picking files through the APK's own Java activity.
jni = "0.22.4"
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

# A workspace of its own, as the wallet and the explorer are, which use it by path.
[workspace]
